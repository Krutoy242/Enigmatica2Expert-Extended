          # was registered, so the mixin silently never applies. Checked, all three are no-ops here:
          # loliasm's is a dev-environment only hack (voidForgeRequirements),
          # Sledgehammer's accessor is called behind an `instanceof` guard,
          # and its Quark one force-disables Improved Sleeping, which sledgehammer.conf
          # (quark.improved-sleeping=false) does not ask for anyway.
          - 'Critical problem: mixins.devenv.json:FMLModContainerMixin from mod loliasm*was loaded too early.'
          - 'Critical problem: mixins.sledgehammer.forge.json:fml.common.FMLModContainerAccessor*was loaded too early.'
          - 'Critical problem: mixins.sledgehammer.quark.json:base.module.ModuleLoaderMixin*was loaded too early.'
          # Same thing, and unfixable anywhere: Cleanroom's own mod discovery loads ASMModParser
          # (CoreModManager.handleLaunch) long before mixin configs are registered
          # (CoreModManager.injectCoreModTweaks). Declined upstream:
          # https://github.com/CleanroomMC/Cleanroom/issues/597
          # Only the ~1-5s startup gain is lost; stellar_core.cfg:ASMModParserImprovements does nothing here.
          - 'Critical problem: mixins.stellar_core_forge_asmmodparser.json:MixinASMModParser*was loaded too early.'
