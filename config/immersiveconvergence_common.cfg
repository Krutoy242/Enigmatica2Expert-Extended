# Configuration file

general {

    mechanical {
        # The maximum rotational speed any mechanical device can reach, in RPM [Default=7200]
        I:maxRpm=7200
    }

    heat {
        # The maximum heat level any heat device can provide or require [Default=2000.0]
        D:maxHeat=2000.0
    }

    multiblocks {
        # How a machine comes apart. PROCESS_QUEUE breaks it down block by block over a few ticks and drops all its materials at the broken block; TEMPLATE_BLOCKS instantly reverts it to the blocks it was built from. Sneak-breaking always uses TEMPLATE_BLOCKS. Applies to Immersive Engineering, Immersive Petroleum and Immersive Technology multiblocks alike [Default=PROCESS_QUEUE]
        # Valid values:
        # PROCESS_QUEUE
        # TEMPLATE_BLOCKS
        S:disassemblyMode=PROCESS_QUEUE
    }

}


