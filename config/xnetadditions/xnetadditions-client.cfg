# Configuration file

##########################################################################################################
# power_tools
#--------------------------------------------------------------------------------------------------------#
# Client-only Controller GUI and preset preferences.
##########################################################################################################

power_tools {
    # Power Tools panel to open when a Controller GUI is opened. Last used is remembered until Minecraft closes. [default: recent]
    S:leftPanelOnOpen=recent

    # Top Power Tools toolbar state when a Controller GUI is opened. [default: closed]
    S:topPanelOnOpen=closed

    # Preset that starts armed for Item channels in a new client session. [default: none]
    S:initialArmedPresetItem=none

    # Preset that starts armed for Energy channels in a new client session. [default: none]
    S:initialArmedPresetEnergy=none

    # Preset that starts armed for Fluid channels in a new client session. [default: none]
    S:initialArmedPresetFluid=none

    # Preset that starts armed for Logic channels in a new client session. [default: none]
    S:initialArmedPresetLogic=none

    # Preset that starts armed for Advanced Energy channels in a new client session. [default: none]
    S:initialArmedPresetAdvancedEnergy=none

    # Preset that starts armed for Mekanism Gas channels in a new client session. [default: none]
    S:initialArmedPresetMekanismGas=none

    # Preset that starts armed for Botania Mana channels in a new client session. [default: none]
    S:initialArmedPresetBotaniaMana=none

    # Preset that starts armed for Thaumcraft Essentia channels in a new client session. [default: none]
    S:initialArmedPresetThaumcraftEssentia=none

    # Preset that starts armed for IC2 EU channels in a new client session. [default: none]
    S:initialArmedPresetIC2EU=none
}


