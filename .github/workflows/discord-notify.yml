name: Discord Notification
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to announce (leave empty for latest)
        required: false
  release:
    types: [released]

concurrency:
  group: discord-notify-${{ github.event.release.tag_name || inputs.tag || 'latest' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discord-notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here pushes; `gh` carries its own token.
          persist-credentials: false

      # This is why the job used to be pinned to ubuntu-22.04. Chrome's sandbox
      # needs unprivileged user namespaces, and 24.04's AppArmor profile denies
      # them, so mdimg's renderer aborts with "No usable sandbox!" — and mdimg
      # still exits 0, which would post the announcement with no images at all.
      # One sysctl lifts the restriction for the rest of the job.
      - name: 🧯 Unblock unprivileged user namespaces for Chrome
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: 📃 Prepare release
        id: prepare
        uses: $/.github/actions/prepare-release
        with:
          tag: ${{ inputs.tag || github.event.release.tag_name }}
          chrome: 'true'

      - name: 🖼️ Generate images from changelog sections
        run: |
          csplit -s -z -f part- latest_release.md '/^## /' '{*}' || cp latest_release.md part-00

          I=0
          for f in part-*; do
            [ -f "$f" ] && [ -s "$f" ] || continue
            pnpm exec mdimg -i "$f" -o "changelog_part_$I.png" -w 800 --css githubDark
            I=$((I+1))
          done

          # mdimg reports a dead renderer only in its own stdout, so check the
          # files rather than the exit code.
          ls changelog_part_*.png >/dev/null 2>&1 \
            || { echo "::error::mdimg rendered nothing — see the log above"; exit 1; }

      - name: 📤 Upload changelog images artifact
        uses: actions/upload-artifact@v7
        with:
          name: discord-images-${{ steps.prepare.outputs.tag_name }}
          path: changelog_part_*.png
          retention-days: 30

      - name: 🖼️ ➡️ Send Discord message
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          RELEASE_NAME: ${{ steps.prepare.outputs.name }}
          RELEASE_URL: ${{ steps.prepare.outputs.html_url }}
        run: |
          PAYLOAD=$(jq -cn \
            --arg u "🚀 New release" \
            --arg a "https://media.forgecdn.net/avatars/820/88/638200951256555174.png" \
            --arg t "__**$RELEASE_NAME**__" \
            --arg l "$RELEASE_URL" \
            '{username:$u,avatar_url:$a,embeds:[{title:$t,url:$l}]}')

          CURL_ARGS=()
          n=0
          for i in changelog_part_*.png; do
            [ -f "$i" ] || continue
            CURL_ARGS+=(-F "files[$((n++))]=@$i")
          done

          curl -sS -X POST -H "Content-Type: multipart/form-data" \
            -F "payload_json=$PAYLOAD" \
            "${CURL_ARGS[@]}" \
            "$WEBHOOK_URL"
