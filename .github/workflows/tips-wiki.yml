name: Update Wiki Tips

on:
  push:
    branches: [master]
    paths:
      - 'resources/tips/lang/**'
  workflow_dispatch:

concurrency:
  group: tips-wiki
  cancel-in-progress: true

# Nothing outside the one job below needs a token at all.
permissions: {}

jobs:
  update-tips:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # pushes to the wiki repository; the pack itself is only read
    # Override `.npmrc` reporter=silent so pnpm output stays verbose for CI debugging
    env:
      npm_config_reporter: default
    steps:
      - uses: actions/checkout@v7
        with:
          # The wiki is cloned with its own tokenised URL below, so the pack
          # checkout never needs a credential of its own.
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📥 Clone wiki
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.wiki.git" Enigmatica2Expert-Extended.wiki

      - name: 📝 Generate wiki tips
        run: pnpm exec tsx .github/scripts/tips_md.ts

      - name: 📤 Commit and push to wiki
        run: |
          cd Enigmatica2Expert-Extended.wiki
          git add Tips/
          git diff --cached --quiet && echo "No changes to wiki" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update tips from lang files"
          git push
