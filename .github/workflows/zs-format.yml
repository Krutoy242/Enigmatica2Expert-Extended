name: ZenScript format suggestions

# One pull-request trigger on purpose. A fork gets a read-only token on
# `pull_request` and simply cannot post a review, so `pull_request_target` is
# the only path that works for everyone. Pairing the two triggers and letting an
# `if` pick between them — what this workflow used to do — bought nothing and
# cost a second, permanently no-op check run on every pull request.
#
# `pull_request_target` runs with write access next to contributed code, so the
# "pin trusted tooling" step puts every executable path back to the base branch
# version. Only `*.zs` survives from the contributor, and `.zs` is never
# executed here — the formatter merely parses it. That same pinning is what
# makes `allow-unsafe-pr-checkout` on the checkout step defensible.
#
# Note that GitHub always reads a `pull_request_target` workflow from the
# repository's **default branch**, so changes to this file only take effect
# once they are on `master`.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.zs'
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to analyse without posting anything
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

# Keyed by event as well, so a `workflow_dispatch` dry-run and the real run for
# the same pull request never cancel one another.
concurrency:
  group: zs-format-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  suggest:
    if: >-
      github.event_name == 'workflow_dispatch'
      || !contains(github.event.pull_request.labels.*.name, 'skip-format')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      HUSKY: '0'
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: 🔎 Resolve pull request
        id: pr
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number || inputs.pr }}" \
            --jq '"number=\(.number)\nhead_sha=\(.head.sha)\nbase_sha=\(.base.sha)"' >> "$GITHUB_OUTPUT"

      - name: 📥 Checkout the contributed code
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ steps.pr.outputs.number }}/head
          fetch-depth: 1
          submodules: false
          persist-credentials: false
          # Checking out a fork's code under `pull_request_target` is exactly the
          # "pwn request" shape, so `actions/checkout` refuses it by default. The
          # next step is the mitigation: everything executable goes back to base.
          allow-unsafe-pr-checkout: true

      - name: 🔒 Pin every executable path to the base branch
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          rm -rf .github mc-tools dev
          TRUSTED=""
          # `.gitmodules` matters as much as the rest: it decides which
          # repository `mc-tools` — the formatter we are about to run — is
          # cloned from.
          for path in .github mc-tools .gitmodules dev package.json pnpm-lock.yaml \
                      pnpm-workspace.yaml .npmrc eslint.config.js tsconfig.json; do
            # `ls-tree` reads the tree entry itself, so it also sees the
            # `mc-tools` submodule gitlink, whose commit object is not fetched.
            if [ -n "$(git ls-tree --name-only "$BASE_SHA" -- "$path")" ]; then
              TRUSTED="$TRUSTED $path"
            fi
          done
          echo "Restoring from base:$TRUSTED"
          git checkout "$BASE_SHA" -- $TRUSTED
          # Commit so the later `git diff` shows the formatter's work and nothing else.
          git -c user.name=ci -c user.email=ci@local commit -qam 'ci: pin trusted tooling' || true
          git status --short

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # `pnpm-workspace.yaml` sets `reporter: silent`, which hides pnpm's own
      # error messages as well — a failed install reaches the log as a bare exit
      # code and nothing else. Neither `npm_config_reporter` nor
      # `PNPM_CONFIG_REPORTER` overrides it; only the flag does.
      - name: 📦 Install dependencies
        run: |
          git submodule update --init --depth 1 mc-tools
          # Not frozen on purpose: the root workspace reaches into
          # `mc-tools/packages/*`, which is a submodule, so every bump of the
          # `mc-tools` pointer leaves the root lockfile a step behind until
          # someone refreshes it. `mc-tools`' own lockfile has no such split and
          # stays frozen.
          pnpm install --no-frozen-lockfile --reporter=default
          pnpm --dir mc-tools install --frozen-lockfile --reporter=default
          pnpm --dir mc-tools --filter @mctools/format --filter @mctools/eslint-plugin-zs run build

      - name: 🧹 Format and collect suggestions
        id: prep
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: pnpm tsx .github/scripts/zs-format-review.ts prepare

      - uses: reviewdog/action-setup@v1
        if: env.DRY_RUN != 'true'
        with:
          reviewdog_version: v0.21.0

      # Runs even when there is nothing to say: fed an empty diff, reviewdog
      # takes down the suggestions it left on earlier pushes that no longer
      # apply. Skipping the step would leave them stranded.
      - name: 💬 Offer the changes as review suggestions
        if: env.DRY_RUN != 'true'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          reviewdog \
            -name='auto-format' \
            -f=diff \
            -f.diff.strip=1 \
            -reporter=github-pr-review \
            -filter-mode=added \
            -level=info \
            -fail-level=none < zs-format.diff

      - name: 📝 Explain what just happened
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: pnpm tsx .github/scripts/zs-format-review.ts summary

      - name: 🔍 Leave the decision trail in the job log
        if: always()
        run: cat zs-format-report.json || true
