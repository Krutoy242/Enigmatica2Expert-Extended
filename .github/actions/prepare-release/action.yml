name: Prepare Release
description: Fetch release info via gh CLI, save changelog, and install pnpm dependencies

inputs:
  tag:
    description: Release tag to fetch (empty falls back to latest)
    required: false
    default: ''
  chrome:
    description: |
      Download Chrome for Puppeteer. Only the changelog-to-PNG path needs a
      browser; leaving this off saves the release publisher a ~150 MB download.
    required: false
    default: 'false'

outputs:
  tag_name:
    description: Release tag name
    value: ${{ steps.release.outputs.tag_name }}
  name:
    description: Release display name
    value: ${{ steps.release.outputs.name }}
  html_url:
    description: Release URL on GitHub
    value: ${{ steps.release.outputs.html_url }}

runs:
  using: composite
  steps:
    - name: 📃 Fetch release info and save changelog
      id: release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_TAG: ${{ inputs.tag }}
      run: |
        if [ -n "$INPUT_TAG" ]; then
          JSON=$(gh release view "$INPUT_TAG" --json tagName,name,body,url)
        else
          JSON=$(gh release view --json tagName,name,body,url)
        fi
        echo "tag_name=$(echo "$JSON" | jq -r .tagName)" >> "$GITHUB_OUTPUT"
        echo "name=$(echo "$JSON"     | jq -r .name)"    >> "$GITHUB_OUTPUT"
        echo "html_url=$(echo "$JSON" | jq -r .url)"     >> "$GITHUB_OUTPUT"
        echo "$JSON" | jq -r .body > latest_release.md

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    # `node-version` must stay ahead of the `packageManager` pin in
    # `package.json`: pnpm 11 refuses to start on anything below Node 22.13.
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm

    - name: 📦 Install dependencies
      shell: bash
      run: pnpm install --prod --frozen-lockfile --ignore-scripts

    # `--ignore-scripts` above skips Puppeteer's own postinstall download, so the
    # browser has to be fetched by hand — and only when a step actually renders.
    - name: 🌐 Install Chrome for Puppeteer
      if: inputs.chrome == 'true'
      shell: bash
      run: pnpm exec puppeteer browsers install chrome
